<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GoPlants · 정원 구경</title>
<meta name="description" content="GoPlants 친구의 과일 정원을 구경해요.">
<meta property="og:title" content="GoPlants · 친구의 정원"><meta property="og:description" content="위젯에서 매일 돌보는 작은 과일 정원">
<meta property="og:image" content="https://goplants.github.io/garden/a/yard.jpg"><meta name="robots" content="noindex">
<style>
@font-face{font-family:'GoRound';src:url(a/goround-b.woff2) format('woff2');font-weight:100 950;font-display:swap}
:root{--ink:#3b2f1e;--sub:#7a6a50;--card:#fffdf6;--line:#e6dcc4;--leaf:#4f7a3a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'GoRound',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);
  background:#e9efd9 url(a/yard.jpg) center top/cover fixed;word-break:keep-all;overflow-wrap:anywhere}
html:lang(ja) body,html:lang(zh-TW) body,html:lang(zh-CN) body{font-family:system-ui,-apple-system,'Hiragino Sans','PingFang TC','PingFang SC','Microsoft JhengHei','Microsoft YaHei',sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 40px}
.card{background:rgba(255,253,246,.94);border:1px solid var(--line);border-radius:22px;padding:20px 16px 18px;box-shadow:0 10px 30px rgba(60,45,20,.18)}
h1{margin:0 0 6px;font-size:24px;line-height:1.3;text-align:center;text-wrap:balance}
.sub{margin:0 0 16px;text-align:center;color:var(--sub);font-size:14px}
.bed{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px;padding:16px 6px 10px;border-radius:16px;
  background:linear-gradient(#cfe3a8,#b9d58e);box-shadow:inset 0 2px 6px rgba(60,80,20,.18)}
.pot{position:relative;height:150px}
.pot img{position:absolute;left:50%;transform:translateX(-50%);max-width:none;display:block}
.pot .pk{bottom:16px;height:52px}
.pot .pf{bottom:16px;height:52px;clip-path:inset(19% 0 0 0);z-index:2}
.pot .tr{z-index:1}
.pot span{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:12px;color:#4a3c24;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.none{grid-column:1/-1;text-align:center;color:var(--sub);padding:24px 0}
.bad{text-align:center;padding:24px 8px;font-size:16px}
.cta{margin:14px auto 0;max-width:420px;text-align:center;background:rgba(255,253,246,.9);border-radius:16px;padding:10px 14px;box-shadow:0 4px 14px rgba(60,45,20,.12)}
.cta b{display:block;font-size:17px;color:var(--leaf)}
.cta p{margin:4px 0 0;color:var(--sub);font-size:14px}
footer{margin:10px auto 0;width:max-content;max-width:100%;text-align:center;font-size:12px;background:rgba(255,253,246,.85);border-radius:999px;padding:6px 12px}
footer a{color:#5b4a2e;margin:0 8px}
@media (max-width:360px){.bed{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><main><div class="card" id="c"></div>
<div class="cta"><b id="soon"></b><p id="tag"></p></div>
<footer id="ft"></footer></main>

ms":"使用條款","privacy":"隱私權政策"},"zh-CN":{"bad":"这个花园链接好像不正确，请再向对方要一次。","tag":"在桌面小组件上每天照顾的小小果树花园","soon":"GoPlants · 即将推出","empty":"还没有盆栽","terms":"使用条款","privacy":"隐私政策"}},"legal":{"ko":"","en":"en/","ja":"ja/","zh-TW":"zh-hant/","zh-CN":"zh-hans/"}};
function lang(){var l=(navigator.language||'ko').toLowerCase();if(l.indexOf('ko')===0)return 'ko';if(l.indexOf('ja')===0)return 'ja';
  if(l.indexOf('zh')===0)return /tw|hk|mo|hant/.test(l)?'zh-TW':'zh-CN';return 'en'}
var L=lang();document.documentElement.lang=L;var U=D.ui[L];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');return decodeURIComponent(escape(atob(s)))}
function read(){var m=/[?&]g=([^&#]+)/.exec(location.search||'');if(!m||m[1].length>16000)return null;
  try{var o=JSON.parse(unb64u(m[1]));if(!o||o.v!==1||!Array.isArray(o.p)||o.p.length>32)return null;
    var p=o.p.filter(function(x){return Array.isArray(x)&&D.crops.hasOwnProperty(x[0])&&typeof x[1]==='string'&&D.pots.hasOwnProperty(x[1])});
    return {n:String(o.n||'?').slice(0,16),f:String(o.f||'').slice(0,20),h:Math.max(0,o.h|0),s:Math.max(0,Math.min(100,Number(o.s)||0)),p:p}}catch(e){return null}}
function pot(x){var c=D.crops[x[0]],ph=52,soil=16+ph*.79,th=c.h;
  return '<div class="pot"><img class="pk" src="a/'+D.pots[x[1]]+'" alt=""><img class="tr" src="a/'+c.i+'" alt="" style="height:'+th+'px;bottom:'+(soil-th*.03).toFixed(1)+'px">'
    +'<img class="pf" src="a/'+D.pots[x[1]]+'" alt=""><span>'+esc(c.n[L]||c.n.en)+'</span></div>'}
var g=read(),el=document.getElementById('c');
if(!g)el.innerHTML='<p class="bad">'+esc(U.bad)+'</p>';
else{var t=D.txt[L]||D.txt.en,soil=D.soil[L][Math.min(4,Math.floor(g.s/20))];
  document.title='GoPlants · '+t.visit.replace('{n}',g.n);
  el.innerHTML='<h1>'+esc(t.visit.replace('{n}',g.n))+'</h1><p class="sub">'+esc(t.sub.replace('{f}',g.f).replace('{h}',g.h).replace('{s}',soil)).replace(/^ · /,'')+'</p>'
    +'<div class="bed">'+(g.p.length?g.p.map(pot).join(''):'<p class="none">'+esc(U.empty)+'</p>')+'</div>'}
document.getElementById('soon').textContent=U.soon;document.getElementById('tag').textContent=U.tag;
document.getElementById('ft').innerHTML='<a href="../terms/'+D.legal[L]+'">'+esc(U.terms)+'</a><a href="../privacy/'+D.legal[L]+'">'+esc(U.privacy)+'</a>';
</script></body></html>
